[package]
name = "ghist"
edition = "2024"
rust-version = "1.99"
description = "An opinionated git log replacement with a Unicode graph"
repository = "https://github.com/shields/ghist"
documentation = "https://docs.rs/ghist"
readme = "README.md"
license = "Apache-2.0"
keywords = ["cli", "git", "history", "graph"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rustix = { version = "1.1.5", default-features = false, features = [
  "std",
  "event",
  "fs",
  "process",
  "termios"
] }
signal-hook = { version = "0.4.5", default-features = false }
unicode-width = "0.2.2"

[dev-dependencies]
proptest = "=1.11.0"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"

string_slice = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
dbg_macro = "deny"
infallible_try_from = "deny"
clone_on_ref_ptr = "deny"
verbose_file_reads = "deny"
tests_outside_test_module = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
