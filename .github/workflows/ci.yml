name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# prettier-ignore
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - run: rustup show active-toolchain
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: make actions-lock-install
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make lint test

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    env:
      # renovate: datasource=crate depName=cargo-llvm-cov
      CARGO_LLVM_COV_VERSION: 0.9.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run:
          rustup toolchain install "$(make print-nightly)" --profile minimal
          --component llvm-tools-preview
      - run:
          cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
          --locked
      - run: make coverage

  test-macos:
    name: Test on macOS
    # Track GA macOS updates so terminal tests exercise the current supported platform.
    # https://github.com/actions/runner-images#available-images
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: make test
