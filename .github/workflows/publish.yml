name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] Reusable CI resolves to the caller's commit.

  publish:
    name: Publish crate
    needs: verify
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io exchanges OIDC identity for a short-lived publish token.
    env:
      # renovate: datasource=crate depName=gitcalver
      GITCALVER_VERSION: 0.20261107.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo install gitcalver --version "$GITCALVER_VERSION" --locked
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - run: make publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
