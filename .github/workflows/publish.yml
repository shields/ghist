name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    # The $/ form pins reusable CI to this commit for GitHub Actions policies.
    # https://github.blog/changelog/2026-07-30-reference-same-repository-actions-with-self-repository-syntax/
    uses: $/.github/workflows/ci.yml

  publish:
    name: Publish crate
    needs: verify
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io exchanges OIDC identity for a short-lived publish token.
    env:
      # renovate: datasource=crate depName=gitcalver
      GITCALVER_VERSION: 0.20261005.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo install gitcalver --version "$GITCALVER_VERSION" --locked
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: make publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
